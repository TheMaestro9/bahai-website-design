name: Deploy to Netlify and GitHub Pages

on:
  push:
    branches:
      - 'release*'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install 📦
        run: npm ci

      # Netlify serves the site from the domain root.
      - name: Build for Netlify 🔧
        run: |
          npm run build
          touch out/.nojekyll
          mv out out-netlify

      # GitHub Pages serves it from /bahai-website-design/.
      # The contact form only receives messages on Netlify.
      - name: Build for GitHub Pages 🔧
        env:
          NEXT_PUBLIC_BASE_PATH: /bahai-website-design
        run: |
          npm run build
          touch out/.nojekyll
          mv out out-gh-pages

      - name: Deploy to Netlify branch 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out-netlify
          branch: netlify-deploy

      - name: Deploy to GitHub Pages branch 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out-gh-pages
          branch: gh-pages
