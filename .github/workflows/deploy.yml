name: Deploy to Netlify branch

on:
  push:
    branches:
      - 'release*'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and Build 🔧
        run: |
          npm ci
          npm run build

      # Pushes the built static site (Next.js export -> out/) to the branch Netlify serves
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          branch: netlify-deploy
